<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>画画接龙 · 你画我猜</title><link rel="stylesheet" href="/styles.css"></head>
<body><main class="shell"><header><div class="logo"><span>✦</span>画画接龙</div><div class="live"><i></i>实时联机</div></header>
<section id="lobby" class="lobby"><div class="kicker">DRAW & GUESS</div><h1>你来画，<em>我来猜。</em></h1><p>两个人轮流画画和猜词，看看谁更懂彼此的脑回路。</p><div class="lobby-card"><label>你的昵称<input id="nameInput" maxlength="12" placeholder="输入昵称" value="小画家"></label><div class="lobby-buttons"><button id="createBtn" class="primary">创建房间 <span>↗</span></button><div class="join"><input id="roomInput" maxlength="4" placeholder="房间码"><button id="joinBtn" class="secondary">加入</button></div></div><small id="lobbyMessage"></small></div></section>
<section id="game" class="hidden"><div class="game-head"><div><div class="kicker">ROOM <span id="roomCode">----</span></div><h2><span id="roundLabel">等待开始</span><span id="roleLabel" class="role"></span></h2></div><button id="copyBtn" class="copy">复制房间码</button></div><div class="players"><div class="player"><span class="avatar coral">✎</span><div><b id="player0Name">玩家 1</b><small>分数 <strong id="score0">0</strong></small></div></div><div class="vs">VS</div><div class="player right"><div><b id="player1Name">等待加入</b><small>分数 <strong id="score1">0</strong></small></div><span class="avatar blue">✦</span></div></div><div class="game-grid"><section class="canvas-card"><div class="canvas-top"><div id="promptBox" class="prompt">等待另一位玩家加入…</div><div id="timer" class="timer">60</div></div><canvas id="canvas" width="900" height="560"></canvas><div class="tools"><button data-color="#2c3340" class="color active"></button><button data-color="#ef8354" class="color coral-dot"></button><button data-color="#e45756" class="color red-dot"></button><button data-color="#f0b429" class="color yellow-dot"></button><button data-color="#4caf75" class="color green-dot"></button><button data-color="#4f8dcc" class="color blue-dot"></button><button data-color="#9b6dcc" class="color purple-dot"></button><button data-color="#f38ab3" class="color pink-dot"></button><input id="sizeInput" type="range" min="2" max="20" value="6"><button id="clearBtn">清空画布</button></div></section><aside class="guess-card"><div class="guess-head"><h3>猜猜看</h3><span>轮流作答</span></div><div id="guessList" class="guess-list"></div><form id="guessForm"><input id="guessInput" maxlength="40" placeholder="输入你的答案…" autocomplete="off"><button>猜！</button></form><div class="chat-head">聊天</div><div id="chatList" class="chat-list"></div><form id="chatForm" class="chat-form"><input id="chatInput" maxlength="160" placeholder="说点什么…" autocomplete="off"><button>发送</button></form></aside></div><div id="message" class="message"></div></section>
<footer><span>画画接龙 · 双人小游戏</span><span>画笔同步 · 彩色画笔 · 自动重连</span></footer></main><div id="toast" class="toast"></div><script src="/socket.io/socket.io.js"></script><script src="/app.js"></script></body></html>
